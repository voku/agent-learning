name: Prepare 0.14.1 changelog

on:
  push:
    branches:
      - 'release/0.14.1'

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run 0.14.1 changelog preparer' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Add 0.14.1 release section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          data = path.read_text()
          needle = '## [Unreleased]\n'
          replacement = '''## [Unreleased]\n\n## [0.14.1] - 2026-09-01\n\n### Added\n\n- Expose complete read-only Finding and Proposal lists through `LearningCatalog`, with optional owner-status filtering and deterministic newest-first ordering, so consumers can browse Learning state without private storage scans.\n\n### Validation\n\n- Exact-head PHP 8.3, 8.4 and 8.5 package CI and the clean installed-skill consumer pass on the owner API follow-up.\n'''
          if data.count(needle) != 1:
              raise SystemExit(f'expected exactly one Unreleased header, found {data.count(needle)}')
          path.write_text(data.replace(needle, replacement, 1))
          PY
          git diff --check -- CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'release: prepare 0.14.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
