name: Real #758 maintenance contract (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner code without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare actual independent frozen agent-loop snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/acceptance
          git clone --no-checkout --filter=blob:none https://github.com/voku/agent-loop.git build/acceptance/agent-loop-base
          git -C build/acceptance/agent-loop-base checkout --detach 622c004e2cc642fce1c06dc63a4f04d4889637e2
          git clone --no-checkout --filter=blob:none https://github.com/voku/agent-loop.git build/acceptance/agent-loop-head
          git -C build/acceptance/agent-loop-head checkout --detach f1d1f7b91a7adad974aa88ca5104135894d43196
          test "$(git -C build/acceptance/agent-loop-base rev-parse HEAD)" = 622c004e2cc642fce1c06dc63a4f04d4889637e2
          test "$(git -C build/acceptance/agent-loop-head rev-parse HEAD)" = f1d1f7b91a7adad974aa88ca5104135894d43196
      - name: Assert actual four-row/five-reference diff and owner proof
        shell: bash
        run: |
          set -euo pipefail
          cat > build/acceptance.php <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__ . '/../vendor/autoload.php';
          use voku\AgentLearning\AppliedGuidanceMaintenanceInspector;
          $root = __DIR__ . '/acceptance';
          $before = $root . '/agent-loop-base';
          $after = $root . '/agent-loop-head';
          $old = (string) file_get_contents($before . '/MEMORY.md');
          $new = (string) file_get_contents($after . '/MEMORY.md');
          $a = explode("\n", $old);
          $b = explode("\n", $new);
          $rows = [];
          foreach ($a as $i => $line) {
              if ($line !== ($b[$i] ?? null)) {
                  $rows[] = $i + 1;
              }
          }
          if ($rows !== [12, 17, 19, 27]) {
              throw new RuntimeException('Unexpected #758 changed MEMORY rows: ' . json_encode($rows));
          }
          if (!str_contains($a[26], 'src/Dogfood/') || !str_contains($b[26], 'tools/Dogfood/')) {
              throw new RuntimeException('Missing actual line-27 rule-text owner path correction.');
          }
          if (!str_contains($b[26], 'tools/Dogfood/SelfShapeEvidence.php')) {
              throw new RuntimeException('Missing line-27 canonical-home repair.');
          }
          $proof = (new AppliedGuidanceMaintenanceInspector())->inspect(
              $before . '/.agent-loop/learning',
              $after . '/.agent-loop/learning',
              'MEMORY.md',
          );
          if ($proof->proposalIds !== ['proposal.2026-08-14.007', 'proposal.2026-08-14.013']) {
              throw new RuntimeException('Expected both actual applied-proposal IDs: ' . json_encode($proof->proposalIds));
          }
          if ($proof->beforeSha256 !== '0f6fc7f561e435f8e9e3e53cf3fc8cc284175ed80b38211880271282c911564a'
              || $proof->afterSha256 !== '7a9afab8ec812280ae036e6afd901d6c8d7e0f35bc3439197a547f886926fa0e') {
              throw new RuntimeException('Actual frozen target hashes disagree with #758 provenance.');
          }
          echo 'PASS exact #758 owner physical proof: ' . implode(', ', $proof->proposalIds) . PHP_EOL;
          echo 'Not a human semantic maintenance verdict.' . PHP_EOL;
          PHP
          php build/acceptance.php
