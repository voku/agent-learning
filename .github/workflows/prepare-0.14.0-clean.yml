name: Prepare 0.14.0 clean

on:
  push:
    branches: [release/0.14.0-clean]
    paths: ['.github/workflows/prepare-0.14.0-clean.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.14.0-clean
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          needle = '## [Unreleased]\n'
          section = '''## [Unreleased]\n\n## [0.14.0] - 2026-09-01\n\n### Added\n\n- Add first-class evidence-backed `LearningNote` precedents for `ADD_LEARNING_NOTE`, with a typed Learning-owned prepare/publish/read/status/retire boundary, stable `pattern_key` ownership, exact Finding/Proposal lineage, redaction, source-drift states, and compact read projections. LearningNotes are durable solved-case precedent, not active guidance or mutation authority.\n- Add the package-owned `agent-learning-note` authoring skill and standalone CLI. The flow grounds current facts separately from validated historical Findings and synthesis, preserves human promotion authority, and ships with clean copied Composer consumer proof plus real bug-shaped and architecture/workflow-shaped dogfood.\n\n### Fixed\n\n- Make `finding-create` failures report the accepted evidence types and missing requirements together so a caller can repair an invalid Finding in one round trip.\n- Expose `outcome_withheld_reason` through the typed `RecallSelectionEvent` owner API so downstream consumers do not need to inspect raw Learning JSONL history.\n- Retire writes of the unversioned legacy outcome shape while keeping existing historical records readable, so new Learning state uses the versioned owner format without rewriting history.\n- Make the installed `agent-learning-note` binary resolve Composer/package autoloading through the same supported path as the primary CLI instead of assuming a package-local `vendor/autoload.php`.\n\n### Validation\n\n- PR #57 established the durable typed LearningNote owner contract and passed exact-head package CI on PHP 8.3, 8.4 and 8.5.\n- PR #59 passed exact-head package CI on PHP 8.3, 8.4 and 8.5, the focused LearningNote authoring regressions, two real-case dogfood fixtures, and the clean copied Composer installed-skill consumer.\n'''
          if '## [0.14.0] - 2026-09-01' in text:
              raise SystemExit('0.14.0 section already present')
          if needle not in text:
              raise SystemExit('Unreleased heading missing')
          path.write_text(text.replace(needle, section, 1))
          PY
          rm .github/workflows/prepare-0.14.0-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-0.14.0-clean.yml
          git commit -m 'chore(release): prepare 0.14.0'
          git push origin HEAD:release/0.14.0-clean
