name: Prepare 0.13.5 metadata

on:
  push:
    branches: ['release/0.13.5']
    paths:
      - '.github/workflows/prepare-0.13.5.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.13.5
      - name: Write release changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          needle = '## [Unreleased]\n'
          section = '''## [Unreleased]\n\n## [0.13.5] - 2026-08-26\n\n### Added\n\n- Add the typed read-only `LearningCatalog` query boundary with bounded overview, finding, proposal, durable-guidance and task-scoped projections. The catalog preserves owner lifecycle states, finding/proposal/task lineage, guidance usage outcomes, rejected/history visibility and explicit attention candidates without exposing Learning's directory layout to consumers.\n'''
          if '## [0.13.5] - 2026-08-26' not in text:
              if needle not in text:
                  raise SystemExit('Unreleased heading not found')
              text = text.replace(needle, section, 1)
              path.write_text(text)
          PY
          rm .github/workflows/prepare-0.13.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-0.13.5.yml
          git commit -m 'chore(release): prepare 0.13.5'
          git push origin HEAD:release/0.13.5
