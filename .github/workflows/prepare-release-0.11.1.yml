name: Prepare 0.11.1 changelog

on:
  push:
    branches:
      - agent/release-0.11.1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.11.1
      - name: Insert release notes and remove helper
        env:
          SECTION_B64: 
        run: |
          php -r '$p="CHANGELOG.md"; $c=file_get_contents($p); $needle="## [Unreleased]\n"; if ($c === false || !str_contains($c, $needle)) { fwrite(STDERR, "missing Unreleased heading\n"); exit(1); } $section=base64_decode(getenv("SECTION_B64"), true); if ($section === false) { exit(1); } file_put_contents($p, str_replace($needle, $needle."\n".$section."\n", $c));'
          rm .github/workflows/prepare-release-0.11.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/prepare-release-0.11.1.yml
          git commit -m "Document 0.11.1"
          git push origin HEAD:agent/release-0.11.1
