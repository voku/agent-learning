name: Prepare 0.13.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.13.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='43eb7eca381c0974bc707ab0b9cd8c5085ceefdc'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $anchor = "## [0.13.0] - 2026-08-16\n";
          if (substr_count($text, $anchor) !== 1) {
              throw new RuntimeException('0.13.0 changelog anchor is not unique');
          }
          if (str_contains($text, '## [0.13.1] - 2026-08-18')) {
              throw new RuntimeException('0.13.1 section already exists');
          }

          $section = <<<'CHANGELOG'
          ## [0.13.1] - 2026-08-18

          ### Added

          - Add `FindingCreator::createValidated()` as the typed owner-level operation for creating one schema-valid validated Finding, including optional ID allocation, target-directory creation, duplicate protection, validation-before-publication, and atomic publication.
          - Add standalone `finding-create` support over the same owner behavior for human and script callers.

          ### Documentation

          - Document `FindingCreator` as the PHP lifecycle-host boundary so orchestrators do not need `finding-id` plus hand-written JSON or knowledge of the `findings/validated` storage layout.
          - Keep the judgment boundary explicit: callers provide evidence-backed content and decide whether a Finding is warranted; Learning owns record validity, not the conclusion itself.

          ### Validation

          - PR #28 passed CI on its exact head before merge for the owner-level Finding creation path.
          - PR #29 passed CI run #240 for the PHP embedding and consumer-skill documentation.

          CHANGELOG;

          $updated = str_replace($anchor, $section . $anchor, $text, $count);
          if ($count !== 1) {
              throw new RuntimeException('Failed to insert 0.13.1 changelog section');
          }
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Cannot write CHANGELOG.md');
          }
          PHP

          mkdir -p .release
          cat > .release/0.13.1.json <<'JSON'
          {
            "target_sha": "43eb7eca381c0974bc707ab0b9cd8c5085ceefdc",
            "version": "0.13.1"
          }
          JSON

          rm .github/workflows/prepare-0.13.1.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.13.1.json .github/workflows/prepare-0.13.1.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.13.1'
          git tag -a '0.13.1' "${target}" -m 'agent-learning 0.13.1'
          git push --atomic origin HEAD:main refs/tags/0.13.1
