name: Connector patch scope-aware precedents

on:
  push:
    branches:
      - chatgpt/87-scope-aware-precedents
    paths:
      - .github/workflows/connector-patch-scope-aware-precedents.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/87-scope-aware-precedents
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/scripts/connector-patch-scope-aware-precedents.py

      - name: Commit patched owner path
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/connector-patch-scope-aware-precedents.yml
          rm .github/scripts/connector-patch-scope-aware-precedents.py
          git diff --check
          git diff -- src/LearningLineageService.php tests/LearningLineageBoundedPrecedentTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/LearningLineageService.php tests/LearningLineageBoundedPrecedentTest.php .github/workflows/connector-patch-scope-aware-precedents.yml .github/scripts/connector-patch-scope-aware-precedents.py
          git commit -m 'fix(lineage): apply task relevance before precedent cap'
          git push origin HEAD:chatgpt/87-scope-aware-precedents
